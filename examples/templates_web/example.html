<!DOCTYPE html>
<html>
<head>
  <title>xeus-runner {{ language }}: {{ title }}</title>
  <script src="./{{ name }}.js" type="module"></script>
  <link rel="stylesheet" href="example.css">
</head>
<body>
  <h2>{{ language }}: {{ title }}</h2>
  <div id="target"></div>
  <script>
    const suffix = new URLSearchParams(location.search).has('worker') ? ' in web worker' : ' in main thread';
    document.title += suffix;
    document.querySelector('h2').textContent += suffix;
  </script>
</body>
</html>
